packages:
  - .

# Layout conservado para reproducibilidad; instalar siempre desde Linux en WSL.
nodeLinker: hoisted
packageImportMethod: copy
confirmModulesPurge: false

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.1'
  - '@vitest/spy@5.0.1'
  - vitest@5.0.1

# Fail with an actionable error instead of implicitly installing on run/exec.
verifyDepsBeforeRun: error
